[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
python_files = ["test_*.py"]
addopts = "--cov --cov-report=term-missing"

[tool.black]
line-length = 79
extend-exclude = "migrations"

[tool.isort]
profile = "black"
line_length = 79
skip = [".venv", "migrations"]

[tool.coverage.run]
source = ["core", "auth_app", "quiz_app"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "manage.py",
    "core/asgi.py",
    "core/wsgi.py",
]
